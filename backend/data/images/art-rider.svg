<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" role="img" aria-label="A Cravio rider on a scooter speeding through the city">
  <rect width="1600" height="1067" fill="#e8edde"/>
  <circle cx="1250" cy="260" r="150" fill="#f4c542"/>
  <!-- skyline -->
  <g fill="#cfd9c0">
    <rect x="40" y="380" width="160" height="420"/>
    <rect x="230" y="300" width="120" height="500"/>
    <rect x="380" y="430" width="200" height="370"/>
    <rect x="980" y="400" width="140" height="400"/>
    <rect x="1150" y="470" width="190" height="330"/>
    <rect x="1370" y="340" width="170" height="460"/>
  </g>
  <!-- road -->
  <rect x="0" y="800" width="1600" height="267" fill="#3f4a44"/>
  <g fill="#e8edde">
    <rect x="60" y="930" width="160" height="16" rx="8"/>
    <rect x="360" y="930" width="160" height="16" rx="8"/>
    <rect x="660" y="930" width="160" height="16" rx="8"/>
    <rect x="960" y="930" width="160" height="16" rx="8"/>
    <rect x="1260" y="930" width="160" height="16" rx="8"/>
  </g>
  <!-- speed lines -->
  <g stroke="#166534" stroke-width="14" stroke-linecap="round" opacity=".5">
    <path d="M150 560 H400"/><path d="M90 640 H380"/><path d="M180 720 H420"/>
  </g>

  <!-- scooter + rider -->
  <g transform="translate(470 380)">
    <!-- delivery box -->
    <rect x="0" y="80" width="230" height="200" rx="18" fill="#ea580c"/>
    <rect x="72" y="138" width="86" height="86" rx="22" fill="#fff"/>
    <path d="M96 176 H134 L129 210 H101 Z" fill="#ea580c"/>
    <path d="M104 176 Q104 158 115 158 Q126 158 126 176" fill="none" stroke="#ea580c" stroke-width="7"/>
    <!-- body -->
    <path d="M40 300 H420 Q520 300 560 360 L600 420 H30 Z" fill="#166534"/>
    <path d="M520 150 L600 420" stroke="#1f2d27" stroke-width="22" stroke-linecap="round"/>
    <path d="M490 150 H560" stroke="#1f2d27" stroke-width="20" stroke-linecap="round"/>
    <!-- wheels -->
    <circle cx="120" cy="430" r="80" fill="#1f2d27"/><circle cx="120" cy="430" r="32" fill="#cfd9c0"/>
    <circle cx="590" cy="430" r="80" fill="#1f2d27"/><circle cx="590" cy="430" r="32" fill="#cfd9c0"/>
    <!-- rider -->
    <path d="M300 300 L360 190 L450 190 L500 300 Z" fill="#15803d"/>
    <path d="M430 210 L530 165" stroke="#15803d" stroke-width="40" stroke-linecap="round"/>
    <path d="M320 300 L420 300 L440 390" fill="none" stroke="#1f2d27" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="400" cy="120" r="70" fill="#fff"/>
    <path d="M400 120 H470 Q470 160 440 170 H400 Z" fill="#1f2d27"/>
    <path d="M330 110 Q340 50 400 50" fill="none" stroke="#ea580c" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
