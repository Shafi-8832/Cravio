<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" role="img" aria-label="A Cravio delivery bag and a steaming bowl next to a phone tracking the order">
  <rect width="1600" height="1067" fill="#fbe7d5"/>
  <circle cx="1300" cy="220" r="260" fill="#f8d4b4"/>
  <circle cx="220" cy="900" r="220" fill="#f8d4b4"/>
  <!-- table -->
  <rect x="0" y="800" width="1600" height="267" fill="#e9b98f"/>
  <rect x="0" y="800" width="1600" height="18" fill="#d9a276"/>

  <!-- paper bag -->
  <g transform="translate(360 300)">
    <path d="M60 80 Q60 0 140 0 Q220 0 220 80" fill="none" stroke="#9a3412" stroke-width="22" stroke-linecap="round"/>
    <path d="M200 80 Q200 0 280 0 Q360 0 360 80" fill="none" stroke="#9a3412" stroke-width="22" stroke-linecap="round"/>
    <path d="M0 80 H420 L450 510 H-30 Z" fill="#c2835a"/>
    <path d="M0 80 H420 L428 150 H-8 Z" fill="#a86a43"/>
    <rect x="140" y="230" width="140" height="140" rx="34" fill="#ea580c"/>
    <path d="M178 290 H242 L234 348 H186 Z" fill="#fff"/>
    <path d="M192 290 Q192 262 210 262 Q228 262 228 290" fill="none" stroke="#fff" stroke-width="10"/>
  </g>

  <!-- bowl with steam -->
  <g transform="translate(860 520)">
    <path d="M40 -60 q-30 -40 0 -80 q30 -40 0 -80" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity=".85"/>
    <path d="M140 -60 q-30 -40 0 -80 q30 -40 0 -80" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity=".85"/>
    <path d="M240 -60 q-30 -40 0 -80 q30 -40 0 -80" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity=".85"/>
    <ellipse cx="140" cy="30" rx="230" ry="46" fill="#f4c542"/>
    <circle cx="70" cy="18" r="22" fill="#b45309"/>
    <circle cx="160" cy="6" r="26" fill="#b45309"/>
    <path d="M200 30 q30 -40 70 -10" fill="none" stroke="#16a34a" stroke-width="14" stroke-linecap="round"/>
    <path d="M-90 30 H370 Q360 250 140 270 Q-80 250 -90 30 Z" fill="#fff"/>
    <path d="M-60 110 H340" stroke="#ea580c" stroke-width="16"/>
  </g>

  <!-- phone tracking the order -->
  <g transform="translate(1240 420) rotate(8)">
    <rect width="230" height="420" rx="34" fill="#1f2d27"/>
    <rect x="16" y="30" width="198" height="360" rx="18" fill="#fff"/>
    <text x="115" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2d27">On its way</text>
    <circle cx="50" cy="140" r="14" fill="#16a34a"/>
    <circle cx="50" cy="210" r="14" fill="#16a34a"/>
    <circle cx="50" cy="280" r="14" fill="#ea580c"/>
    <circle cx="50" cy="350" r="14" fill="#e5e7eb"/>
    <path d="M50 154 V196 M50 224 V266 M50 294 V336" stroke="#d1d5db" stroke-width="6"/>
    <rect x="80" y="132" width="110" height="16" rx="8" fill="#d1d5db"/>
    <rect x="80" y="202" width="90" height="16" rx="8" fill="#d1d5db"/>
    <rect x="80" y="272" width="120" height="16" rx="8" fill="#fdba74"/>
    <rect x="80" y="342" width="70" height="16" rx="8" fill="#e5e7eb"/>
  </g>
</svg>
